# ==============================================================================
# Linux Kernel TCP/IP Stack Hardening for DoS/DDoS & hping3 Mitigation
# File: /etc/sysctl.d/99-anti-ddos.conf
# Apply with: sudo sysctl -p /etc/sysctl.d/99-anti-ddos.conf
# ==============================================================================

# 1. TCP SYN Flood Protection (hping3 -S / --flood mitigation)
# Enable SYN cookies: when SYN backlog overflows, cryptographic cookies are sent
net.ipv4.tcp_syncookies = 1

# Increase half-open connection queue size (SYN backlog)
net.ipv4.tcp_max_syn_backlog = 8192

# Reduce SYN-ACK retries before discarding half-open connection (default 5 -> 2)
# Drops dead/spoofed client SYN attempts in ~7 seconds instead of ~30 seconds
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 2

# Maximum connections queue handled by socket listen()
net.core.somaxconn = 65535

# Maximum packets queued on input interface before processing by kernel
net.core.netdev_max_backlog = 16384

# 2. Connection Exhaustion & TIME_WAIT Socket Recycling
# Reuse TIME_WAIT sockets for new connections when safe
net.ipv4.tcp_tw_reuse = 1

# Reduce socket lingering time in FIN-WAIT-2 state (default 60s -> 15s)
net.ipv4.tcp_fin_timeout = 15

# Protect against TCP TIME_WAIT assassination hazards (RFC 1337)
net.ipv4.tcp_rfc1337 = 1

# Total number of orphaned (not attached to any user handle) TCP sockets
net.ipv4.tcp_max_orphans = 65536
net.ipv4.tcp_orphan_retries = 1

# 3. IP Spoofing & Source Route Hardening (Anti-Smurf / Anti-Scan)
# Turn on Reverse Path Filtering (RPF) to drop packets with spoofed source IPs
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Disable ICMP Redirect Acceptance (Prevents MITM route alteration)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Do not accept IP source routed packets (prevents routing spoofing)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# 4. ICMP Flood Protection (hping3 -1 / ICMP ping flood)
# Ignore ICMP broadcast echo requests (Mitigates Smurf amplification attacks)
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Rate limit ICMP generation (tokens per ms)
net.ipv4.icmp_ratelimit = 100
net.ipv4.icmp_ratemask = 8808

# 5. Memory & Buffer Tuning for High Concurrency
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
