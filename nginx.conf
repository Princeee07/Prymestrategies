# ==============================================================================
# NGINX API Gateway & Reverse Proxy Configuration
# Features:
#  - Anti-DDoS & Slowloris Hardening
#  - Multi-Project Split-Port Routing (Project 1: :3000, Project 2: :3001)
#  - Multi-Tier Rate Limiting (Auth: 5r/m, Forms: 10r/m, General: 30r/s)
#  - Strict 5MB Max Body Size Limit
# ==============================================================================

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # --------------------------------------------------------------------------
    # 1. Anti-Slowloris & Connection Resource Guards
    # --------------------------------------------------------------------------
    # Drop slow connections taking more than 10s to send headers or body
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;

    # Enforce strict 5MB payload limit to block memory-exhaustion uploads
    client_max_body_size  5M;

    # Buffers to prevent memory bloat during flood attacks
    client_body_buffer_size      128k;
    client_header_buffer_size    1k;
    large_client_header_buffers  4 8k;

    # --------------------------------------------------------------------------
    # 2. Rate Limiting Zones (Leaky / Token Bucket Algorithm)
    # --------------------------------------------------------------------------
    # Zone 1: Auth endpoints (Brute-force & CPU DoS protection) -> 5 requests/minute
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Zone 2: Form submissions (Bookings & Applications) -> 10 requests/minute
    limit_req_zone $binary_remote_addr zone=form_limit:10m rate=10r/m;

    # Zone 3: General API & Site traffic -> 30 requests/second
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

    # Connection limit: max 20 simultaneous connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Status code to return when rate limits are exceeded
    limit_req_status 429;
    limit_conn_status 429;

    # --------------------------------------------------------------------------
    # 3. Multi-Project Upstream Definitions (Split Ports)
    # --------------------------------------------------------------------------
    # Project 1: Pryme Strategies (Next.js 16 Replicas)
    upstream prymestrategies_backend {
        least_conn;
        # Docker Compose service names (default):
        server app_prymestrategies_1:3000 max_fails=3 fail_timeout=10s;
        server app_prymestrategies_2:3000 max_fails=3 fail_timeout=10s;
        # For bare-metal / host system NGINX, swap with:
        # server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Project 2: Next Project (Internal port 3001)
    upstream next_project_backend {
        least_conn;
        # Docker Compose service name (default):
        server app_next_project:3001 max_fails=3 fail_timeout=10s;
        # For bare-metal / host system NGINX, swap with:
        # server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # 4. Standard Proxy Headers
    # --------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # ==========================================================================
    # Server Block: Public HTTP Ingress (Port 80)
    # ==========================================================================
    server {
        listen 80;
        server_name prymestrategies.com www.prymestrategies.com localhost;

        # Connection Limit per IP
        limit_conn conn_limit 20;

        # Custom JSON 429 Response with Retry-After Header
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            add_header Retry-After 60 always;
            return 429 '{"error":"Too Many Requests","message":"Rate limit exceeded. Please wait before retrying."}';
        }

        # ----------------------------------------------------------------------
        # Routing: Project 2 (Next Project) accessible via /project2/ or subdomain
        # ----------------------------------------------------------------------
        location /project2/ {
            limit_req zone=general_limit burst=20 nodelay;
            rewrite ^/project2/(.*)$ /$1 break;
            proxy_pass http://next_project_backend;
        }

        # ----------------------------------------------------------------------
        # Routing: Project 1 (Pryme Strategies) - Auth Sensitive Endpoint
        # Rate limit: 5 req/min, burst=2
        # ----------------------------------------------------------------------
        location = /api/auth/login {
            limit_req zone=auth_limit burst=2 nodelay;
            proxy_pass http://prymestrategies_backend;
        }

        # ----------------------------------------------------------------------
        # Routing: Project 1 - Public Form Submissions (Bookings & Applications)
        # Rate limit: 10 req/min, burst=5, max 5MB body size
        # ----------------------------------------------------------------------
        location ~* ^/api/(bookings|applications)$ {
            client_max_body_size 5M;
            limit_req zone=form_limit burst=5 nodelay;
            proxy_pass http://prymestrategies_backend;
        }

        # ----------------------------------------------------------------------
        # Routing: Static Next.js Assets (Cache-friendly, bypasses strict limits)
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://prymestrategies_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ----------------------------------------------------------------------
        # Routing: Default App Ingress (Project 1)
        # Rate limit: 30 req/sec, burst=30
        # ----------------------------------------------------------------------
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://prymestrategies_backend;
        }
    }

    # ==========================================================================
    # Server Block: Dedicated Port for Project 2 (Optional Direct Port Exposure)
    # ==========================================================================
    server {
        listen 8080;
        server_name _;

        limit_conn conn_limit 20;

        location / {
            limit_req zone=general_limit burst=30 nodelay;
            proxy_pass http://next_project_backend;
        }
    }
}
