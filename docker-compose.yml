# ==============================================================================
# Docker Compose: Multi-Project Ingress & DoS/DDoS Mitigation Architecture
# Includes:
#   1. NGINX Reverse Proxy & API Gateway (Ports 80 & 8080)
#   2. Project 1: Pryme Strategies (2 Replicas on Port 3000 with Load Balancing)
#   3. Project 2: Next Project (Internal Port 3001)
#   4. Redis Service for Distributed Rate Limiting
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. API Gateway & Reverse Proxy (NGINX)
  # Acts as the single public-facing entry point. Drops floods, limits rates.
  # ----------------------------------------------------------------------------
  api_gateway:
    image: nginx:alpine
    container_name: api_gateway
    restart: always
    ports:
      - "80:80"       # Public ingress for Project 1 & routes
      - "8080:8080"   # Direct port ingress for Project 2
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_prymestrategies_1
      - app_prymestrategies_2
      - app_next_project
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 2. Project 1: Pryme Strategies (Replica 1)
  # ----------------------------------------------------------------------------
  app_prymestrategies_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prymestrategies_node_1
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 3. Project 1: Pryme Strategies (Replica 2 - Load Balanced)
  # ----------------------------------------------------------------------------
  app_prymestrategies_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prymestrategies_node_2
    restart: always
    expose:
      - "3000"
    env_file:
      - .env.local
    environment:
      - PORT=3000
      - NODE_ENV=production
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 4. Project 2: Next Project (Isolated internal service on port 3001)
  # ----------------------------------------------------------------------------
  app_next_project:
    image: hashicorp/http-echo:latest
    container_name: next_project_app
    command: ["-text=Welcome to Project 2 (Routed via API Gateway on port 3001)", "-listen=:3001"]
    restart: always
    expose:
      - "3001"
    networks:
      - edge_network

  # ----------------------------------------------------------------------------
  # 5. Distributed Cache & Rate Limiting Store (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis_ratelimit
    restart: always
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    expose:
      - "6379"
    networks:
      - edge_network

networks:
  edge_network:
    driver: bridge
